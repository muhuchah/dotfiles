# General settings
fullscreen=yes
keep-open=yes
save-position-on-quit=yes
watch-later-directory=~/.config/mpv/watch_later/
screenshot-directory=/home/lash/Pictures/Screenshots/
screenshot-template="%F-%n"

# Scripts
script-opts-append=volume-bar-position=top-right
script-opts-append=volume-bar-bar_width=200
script-opts-append=volume-bar-bar_height=4
script-opts-append=volume-bar-bar_radius=2
script-opts-append=volume-bar-bar_color=FFFFFF
script-opts-append=volume-bar-bar_alpha=0.8
script-opts-append=volume-bar-bar_bg_color=000000
script-opts-append=volume-bar-bar_bg_alpha=0.3
script-opts-append=volume-bar-animation_duration=0.2
script-opts-append=volume-bar-fadeout_duration=0.5
script-opts-append=volume-bar-show_text=yes
script-opts-append=volume-bar-text_size=24
script-opts-append=volume-bar-text_color=FFFFFF
script-opts-append=volume-bar-text_alpha=0.9
script-opts-append=volume-bar-text_margin=10
script-opts-append=volume-bar-margin_x=20
script-opts-append=volume-bar-margin_y=20

# Load scripts
script=~/.config/mpv/scripts/volume-bar.lua

# Volume bar settings
volume-max=200
volume-step=2
osd-bar=no
osd-level=1

# Video settings
hwdec=auto
vo=gpu
gpu-api=vulkan
gpu-dumb-mode=no
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=7

# Audio settings
volume=100
audio-device=auto
audio-channels=stereo
audio-samplerate=48000
audio-format=floatne

# Subtitle settings
sub-auto=fuzzy
sub-font-size=100
sub-blur=0.2
sub-scale=0.8
sub-color=1.0
sub-border-color=0.0
sub-border-size=2.0
sub-shadow-offset=1.0
sub-shadow-color=0.0

# Input settings
input-default-bindings=yes
input-vo-keyboard=yes
input-terminal=no
input-ipc-server=/tmp/mpv.sock

# Cache settings
cache=yes
cache-secs=300
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

# Performance settings
vd-lavc-dr=yes
vd-lavc-threads=0
hwdec-codecs=all
gpu-context=win
spirv-compiler=auto

# OSD settings
osd-scale=1.0
osd-font-size=25

# Screenshot settings
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes
screenshot-png-compression=9
screenshot-jpeg-quality=95

# Network settings
ytdl=yes
ytdl-format=bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best
ytdl-raw-options=format-sort=res,fps,codec,size,br,asr,proto
