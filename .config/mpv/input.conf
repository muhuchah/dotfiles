# Playback Control
SPACE cycle pause
ENTER cycle fullscreen
ESC set fullscreen no
q quit
Q quit-watch-later

# Volume Control
UP add volume 2
DOWN add volume -2
RIGHT seek 5
LEFT seek -5
m cycle mute
* add volume 2
/ add volume -2
9 add volume -2
0 add volume 2
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
MOUSE_BTN4 add volume 2
MOUSE_BTN5 add volume -2
AXIS_UP add volume 2
AXIS_DOWN add volume -2

# Playback Speed
[ multiply speed 0.9091
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0
\ cycle-values speed 2.0 1.0 0.5 0.25

# Seeking
PGUP seek 600
PGDWN seek -600
HOME seek 0 absolute
END seek 100% absolute
Ctrl+LEFT seek -10
Ctrl+RIGHT seek 10
Alt+LEFT seek -30
Alt+RIGHT seek 30
Shift+LEFT seek -60
Shift+RIGHT seek 60

# Subtitle Control
v cycle sub-visibility
V cycle sub
j cycle sub
J cycle sub down
# Subtitle timing
z add sub-delay -0.1
x add sub-delay +0.1
Z add sub-delay -0.5
X add sub-delay +0.5
c add sub-delay -1
C add sub-delay +1

# Audio Control
# switch audio tracks
# cycle audio
# cycle audio down
# adjust audio delay
k add audio-delay -0.1
K add audio-delay +0.1
l add audio-delay -0.5
L add audio-delay +0.5
; add audio-delay -1
: add audio-delay +1

# Video Control
1 add contrast -1
2 add contrast 1
3 add brightness -1
4 add brightness 1
5 add gamma -1
6 add gamma 1
7 add saturation -1
8 add saturation 1
d cycle deinterlace
D cycle deinterlace
f cycle fullscreen
F cycle fullscreen
p cycle pause
P cycle pause
r add video-rotate 90
R add video-rotate -90
s screenshot
S screenshot video
Ctrl+s screenshot
Ctrl+S screenshot video
Ctrl+1 add video-zoom 0.1
Ctrl+2 add video-zoom -0.1
Ctrl+3 set video-zoom 0
Ctrl+4 set video-zoom 1
Ctrl+5 set video-zoom 2

# Playlist Control
PLAY cycle pause
STOP stop
NEXT playlist-next
PREV playlist-prev
Ctrl+PLAY cycle pause
Ctrl+STOP stop
Ctrl+NEXT playlist-next
Ctrl+PREV playlist-prev

# Window Control
WINDOW_LEADER+1 set window-scale 0.5
WINDOW_LEADER+2 set window-scale 1.0
WINDOW_LEADER+3 set window-scale 2.0
WINDOW_LEADER+4 set window-scale 3.0
WINDOW_LEADER+5 set window-scale 4.0
WINDOW_LEADER+6 set window-scale 5.0
WINDOW_LEADER+7 set window-scale 6.0
WINDOW_LEADER+8 set window-scale 7.0
WINDOW_LEADER+9 set window-scale 8.0
WINDOW_LEADER+0 set window-scale 1.0

# Mouse Control
MOUSE_BTN0 cycle pause
MOUSE_BTN2 cycle fullscreen
MOUSE_BTN3_DBL cycle fullscreen
MOUSE_BTN6 seek -10
MOUSE_BTN7 seek 10

# Drag and Drop
DRAG_START cycle pause
DRAG_END cycle pause

# Additional Features
# Screenshot with timestamp
Ctrl+Alt+s screenshot
# Toggle OSD
o cycle-values osd-level 3 1 0
# Toggle stats
i cycle-values show-stats 1 0
# Toggle video equalizer
e cycle-values video-equalizer 1 0
# Toggle hardware decoding
h cycle-values hwdec auto no
# Toggle aspect ratio
A cycle-values video-aspect 16:9 4:3 2.35:1 -1
# Toggle video filter
v cycle-values vf "format=yuv420p" "format=yuv420p10le" ""
# Toggle audio filter
a cycle-values af "volume=2" "volume=0.5" "" 